<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoodieExpress | Admin Dashboard</title>

<style>
*{
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body{
  margin:0;
  background:#f4f6f9;
  color:#333;
}

/* HEADER */
header{
  background:#ff5722;
  color:white;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:22px;
}

header button{
  background:#fff;
  color:#ff5722;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

/* LAYOUT */
.container{
  padding:25px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card h3{
  margin:0;
  color:#777;
  font-size:14px;
}

.card p{
  margin-top:8px;
  font-size:24px;
  font-weight:bold;
  color:#ff5722;
}

/* TABLE */
.table-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  margin-bottom:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  text-align:left;
}

th{
  background:#ff5722;
  color:white;
}

tr:nth-child(even){
  background:#f9f9f9;
}

/* BUTTONS */
.delete-btn{
  background:#e53935;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.add-btn{
  background:#43a047;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

/* FORM */
form input{
  padding:10px;
  margin:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* IMAGE */
img{
  border-radius:6px;
}
</style>
</head>

<body>

<header>
  <h1>🍔 FoodieExpress Admin</h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">
    <div class="card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
    <div class="card">
      <h3>Total Sales</h3>
      <p id="grandTotal">₹0</p>
    </div>
  </div>

  <!-- ORDERS -->
  <div class="table-box">
    <h2>📦 Orders</h2>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Items</th>
          <th>Total</th>
          <th>Payment</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ADD FOOD -->
  <div class="table-box">
    <h2>🍕 Manage Menu</h2>
    <form id="addFoodForm" enctype="multipart/form-data">
      <input type="text" id="foodName" placeholder="Food Name" required>
      <input type="text" id="foodDesc" placeholder="Description">
      <input type="number" id="foodPrice" placeholder="Price" required>
      <input type="file" id="foodImage" required>
      <button class="add-btn">Add Food</button>
    </form>

    <table id="foodTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Image</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
const API_ORDERS="http://localhost:5006/api/orders";
const API_FOOD="http://localhost:5006/api/food";

async function loadOrders(){
  const tbody=document.querySelector("#ordersTable tbody");
  tbody.innerHTML="";
  const res=await fetch(API_ORDERS);
  const orders=await res.json();

  document.getElementById("totalOrders").innerText=orders.length;

  let total=0;
  orders.forEach(o=>{
    total+=o.total;
    tbody.innerHTML+=`
      <tr>
        <td>${o.orderId}</td>
        <td>${new Date(o.createdAt).toLocaleString()}</td>
        <td>${o.items.map(i=>`${i.name} x ${i.quantity}`).join("<br>")}</td>
        <td>₹${o.total}</td>
        <td>${o.paymentMethod||"COD"}</td>
        <td><button class="delete-btn" onclick="deleteOrder('${o._id}')">Delete</button></td>
      </tr>`;
  });
  document.getElementById("grandTotal").innerText="₹"+total;
}

async function deleteOrder(id){
  if(confirm("Delete order?")){
    await fetch(API_ORDERS+"/"+id,{method:"DELETE"});
    loadOrders();
  }
}

async function loadFoods(){
  const tbody=document.querySelector("#foodTable tbody");
  tbody.innerHTML="";
  const res=await fetch(API_FOOD);
  const foods=await res.json();
  foods.forEach(f=>{
    tbody.innerHTML+=`
    <tr>
      <td>${f.name}</td>
      <td>${f.description||""}</td>
      <td>₹${f.price}</td>
      <td><img src="http://localhost:5006/uploads/${f.image}" width="60"></td>
      <td><button class="delete-btn" onclick="deleteFood('${f._id}')">Delete</button></td>
    </tr>`;
  });
}

async function deleteFood(id){
  if(confirm("Delete food?")){
    await fetch(API_FOOD+"/"+id,{method:"DELETE"});
    loadFoods();
  }
}

document.getElementById("addFoodForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  await fetch(API_FOOD+"/add",{method:"POST",body:fd});
  e.target.reset();
  loadFoods();
});

function logout(){
  sessionStorage.removeItem("admin");
  location.href="admin_login.html";
}

if(sessionStorage.getItem("admin")!=="true"){
  location.href="admin_login.html";
}

loadOrders();
loadFoods();
</script>

</body>
</html>
