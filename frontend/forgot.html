<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FoodieExpress</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>
    <header>
        <div class="logo">🍔 FoodieExpress</div>
    </header>

    <div class="forgot-container">
        <form id="forgotForm" class="forgot-form">
            <h2>Forgot Your Password?</h2>
            <p>Enter your email address and we'll send you a reset link.</p>

            <div class="form-group">
                <label for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" name="forgotEmail" required>
            </div>

            <button type="submit" class="reset-btn">Send Reset Link</button>

            <p id="forgotMessage"></p>

            <div class="links">
                <a href="login.html">Back to Login</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 FoodieExpress. All rights reserved. | <a href="policy.html">Privacy Policy</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
